name: CI/CD Spring Boot con Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Esto convertirá el nombre de tu repositorio a minúsculas automáticamente
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. INTEGRACIÓN CONTINUA: Probar y Compilar
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven # Cambiar a 'gradle' si usas Gradle

      - name: Give Maven Wrapper execute permission
        run: chmod +x mvnw
        
      - name: Ejecutar Pruebas Unitarias
        run: ./mvnw test # Cambiar a './gradlew test' si aplica

  # 2. ENTREGA CONTINUA: Construir imagen Docker y subirla a GitHub Registry
  push-to-registry:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # 3. DESPLIEGUE CONTINUO: Conectarse al servidor Ubuntu y actualizar el contenedor
  deploy:
    needs: push-to-registry
    runs-on: self-hosted
    steps:
      - name: Desplegar en Ubuntu Server
        run: |
            # 1. Iniciar sesión en el registro de GitHub desde el servidor local
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # 2. Detener y remover el contenedor anterior si ya existía
            docker stop spring-app || true
            docker rm spring-app || true
            
            # 3. Descargar la versión más reciente de la imagen
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 4. Iniciar el nuevo contenedor mapeando el puerto 8080
            docker run -d --name spring-app -p 8080:8080 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # 5. Limpieza de imágenes antiguas colgadas
            docker image prune -f
