spring.application.name=store

# URL de conexión a SQL Server (puerto predeterminado 1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=alsuper;encrypt=true;trustServerCertificate=true

# Credenciales de acceso
spring.datasource.username=sa
spring.datasource.password=zero1234

# Driver JDBC de Microsoft SQL Server
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración opcional de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl