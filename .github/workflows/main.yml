name: CI/CD Spring Boot con Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  # Esto convertirá el nombre de tu repositorio a minúsculas automáticamente
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. INTEGRACIÓN CONTINUA: Probar y Compilar
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven # Cambiar a 'gradle' si usas Gradle

      - name: Give Maven Wrapper execute permission
        run: chmod +x mvnw
        
      - name: Ejecutar Pruebas Unitarias
        run: ./mvnw test # Cambiar a './gradlew test' si aplica

  # 2. ENTREGA CONTINUA: Construir imagen Docker y subirla a GitHub Registry
  push-to-registry:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Construir y Subir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # 3. DESPLIEGUE CONTINUO: Conectarse al servidor Ubuntu y actualizar el contenedor
  deploy:
    needs: push-to-registry
    runs-on: self-hosted 
    steps:
      - name: Desplegar Docker localmente
        run: |
          # 1. Convertir el nombre del repositorio a minúsculas de forma segura en Bash
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URL="ghcr.io/${REPO_LOWER}:latest"
          
          # 2. Iniciar sesión en GitHub Packages
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 3. Detener y remover contenedor viejo (redireccionando errores para que no rompa el pipeline si no existen)
          docker stop spring-app 2>/dev/null || true
          docker rm spring-app 2>/dev/null || true
          
          # 4. Traer la nueva imagen usando la URL en minúsculas
          docker pull $IMAGE_URL
          
          # 5. Correr el contenedor mapeando el puerto 8080
          docker run -d --name spring-app -p 8080:8080 $IMAGE_URL
          
          # 6. Limpieza de imágenes antiguas colgadas
          docker image prune -f
