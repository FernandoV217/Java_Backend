spring.application.name=store

# URL conection to  SQL Server
# LOCAL
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=alsuper;encrypt=true;trustServerCertificate=true
#spring.datasource.username=sa
#spring.datasource.password=zero1234

# PRODUCTION
spring.datasource.url=jdbc:sqlserver://alsuper:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC de Microsoft SQL Server
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración opcional de JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl